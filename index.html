<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel SMM</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #0056b3; }
        #respuesta { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Crear Nuevo Pedido</h2>
    <form id="orderForm">
        <label for="service">ID del Servicio:</label>
        <input type="text" id="service" value="1" required>

        <label for="link">Enlace / Link del Objetivo:</label>
        <input type="url" id="link" placeholder="https://..." required>

        <label for="quantity">Cantidad:</label>
        <input type="number" id="quantity" value="1000" required>

        <button type="submit">Enviar Pedido</button>
    </form>

    <div id="respuesta"></div>
</div>

<script>
    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const service = document.getElementById('service').value;
        const link = document.getElementById('link').value;
        const quantity = document.getElementById('quantity').value;
        const respuestaDiv = document.getElementById('respuesta');

        respuestaDiv.style.display = 'block';
        respuestaDiv.style.backgroundColor = '#e0e0e0';
        respuestaDiv.innerText = 'Enviando pedido...';

        try {
            // AQUÍ CONECTAMOS CON TU BACKEND EN RENDER:
            const response = await fetch('https://mi-panel-backend.onrender.com/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ service, link, quantity })
            });

            const data = await response.json();

            if (response.ok) {
                respuestaDiv.style.backgroundColor = '#d4edda';
                respuestaDiv.style.color = '#155724';
                respuestaDiv.innerText = 'Pedido realizado con éxito: ' + JSON.stringify(data);
            } else {
                respuestaDiv.style.backgroundColor = '#f8d7da';
                respuestaDiv.style.color = '#721c24';
                respuestaDiv.innerText = 'Error: ' + (data.error || 'Ocurrió un problema');
            }
        } catch (error) {
            respuestaDiv.style.backgroundColor = '#f8d7da';
            respuestaDiv.style.color = '#721c24';
            respuestaDiv.innerText = 'Error al conectar con el servidor backend en Render.';
        }
    });
</script>

</body>
</html>

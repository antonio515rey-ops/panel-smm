<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel SMM</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #resultado { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Nuevo Pedido SMM</h2>
        <form id="orderForm">
            <div class="form-group">
                <label for="service">ID de Servicio:</label>
                <input type="number" id="service" required placeholder="Ej. 101">
            </div>
            <div class="form-group">
                <label for="link">Enlace (Link):</label>
                <input type="url" id="link" required placeholder="https://...">
            </div>
            <div class="form-group">
                <label for="quantity">Cantidad:</label>
                <input type="number" id="quantity" required placeholder="1000">
            </div>
            <button type="submit">Enviar Pedido</button>
        </form>
        <div id="resultado"></div>
    </div>

    <script>
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const service = document.getElementById('service').value;
            const link = document.getElementById('link').value;
            const quantity = document.getElementById('quantity').value;
            const resultadoDiv = document.getElementById('resultado');

            resultadoDiv.style.color = '#555';
            resultadoDiv.innerText = 'Enviando orden...';

            try {
                // Conexión directa con tu backend en Render
                const response = await fetch('https://express-hello-world-52u9.onrender.com/api/order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ service, link, quantity })
                });

                const data = await response.json();

                if (response.ok) {
                    resultadoDiv.style.color = 'green';
                    resultadoDiv.innerText = '¡Pedido enviado con éxito! ID: ' + (data.order || 'Registrado');
                } else {
                    resultadoDiv.style.color = 'red';
                    resultadoDiv.innerText = 'Error: ' + (data.error || 'No se pudo procesar');
                }
            } catch (error) {
                console.error('Error:', error);
                resultadoDiv.style.color = 'red';
                resultadoDiv.innerText = 'Error de conexión con el servidor.';
            }
        });
    </script>

</body>
</html>
